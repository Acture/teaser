[workspace]
members = ["runtime/herdr", "crates/teaser-core"]
exclude = ["prototypes/attachment-runtime"]
resolver = "2"

# Cargo only applies patches from the workspace root. Keep this aligned with
# the inherited Herdr manifest; its vendored PTY fixes are part of the fork.
[patch.crates-io]
portable-pty = { path = "runtime/herdr/vendor/portable-pty" }
