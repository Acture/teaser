[workspace]
members = ["src/runtime/herdr", "src/crates/teaser-core"]
exclude = ["src/prototypes/attachment-runtime"]
resolver = "2"

# Cargo only applies patches from the workspace root. Keep this aligned with
# the inherited Herdr manifest; its vendored PTY fixes are part of the fork.
[patch.crates-io]
portable-pty = { path = "src/runtime/herdr/vendor/portable-pty" }
