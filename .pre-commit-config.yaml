# The repository gate. Formatting and static analysis run on commit; tests and
# the application bundle build also run on pre-push.
#
#     pre-commit install          # wires both stages, once
#     pre-commit run --all-files --hook-stage pre-push
#
# Every project-specific entry is `repo: local` with `language: system`, so the
# gate runs the same toolchain a developer already has rather than fetching an
# environment of its own.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # These replace `git diff --check HEAD`, which only ever compared the
      # working tree against HEAD and so passed vacuously on a clean tree.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^src/(patches/|runtime/herdr/)
      - id: end-of-file-fixer
        exclude: ^src/(patches/|runtime/herdr/)
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        # Vendored upstream material keeps its own formatting; a clang-format
        # file is YAML that this hook cannot read as a single document.
        exclude: ^src/runtime/herdr/vendor/

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)Cargo\.(toml|lock)$|(^|/)rustfmt\.toml$|^rust-toolchain\.toml$)

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$)

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --all-targets --locked
        language: system
        pass_filenames: false
        files: (\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$)
        stages: [pre-push]

      # Herdr embeds libghostty-vt and needs Zig 0.16.0. The retired attachment
      # runtime is deliberately outside this Cargo workspace and these gates.

      # Check applicability only; compiling Ghostty remains a separate gate.
      # Keep this list complete when adding patches. Check both patches even
      # when only the gitlink changes; gitlinks do not have the `file` type.
      - id: ghostty-patches-apply
        name: Ghostty patches apply
        entry: git apply --check --directory=src/vendor/ghostty
        args:
          - src/patches/ghostty/0001-test-tracked-semantic-output-reflow.patch
          - src/patches/ghostty/0002-external-surface-io.patch
        language: system
        pass_filenames: false
        types: []
        files: ^(src/patches/ghostty/.*\.patch|src/vendor/ghostty|\.gitmodules|\.pre-commit-config\.yaml)$

      # One hook per harness: each is a plain executable that exits non-zero on
      # failure. `swift run` builds incrementally, so a hook also works alone
      # in a clean checkout and cannot execute a stale binary after an edit.
      - id: swift-test-probe
        name: TeaserProbeTests
        entry: swift run TeaserProbeTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-layout
        name: TeaserLayoutTests
        entry: swift run TeaserLayoutTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-presentation-store
        name: TeaserPresentationStoreTests
        entry: swift run TeaserPresentationStoreTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-topology
        name: TeaserDesktopStageTopologyTests
        entry: swift run TeaserDesktopStageTopologyTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-controls
        name: TeaserDesktopStageControlsTests
        entry: swift run TeaserDesktopStageControlsTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-safety
        name: TeaserDesktopStageSafetyTests
        entry: swift run TeaserDesktopStageSafetyTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-external-window
        name: TeaserExternalWindowTests
        entry: swift run TeaserExternalWindowTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-window-adoption
        name: TeaserWindowAdoptionTests
        entry: swift run TeaserWindowAdoptionTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-canvas-lifecycle
        name: TeaserCanvasLifecycleTests
        entry: swift run TeaserCanvasLifecycleTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-canvas-accessibility
        name: TeaserCanvasAccessibilityTests
        entry: swift run TeaserCanvasAccessibilityTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/app/macos/TeaserPrivateAccessibility/|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: swift-test-herdr
        name: TeaserHerdrTests
        entry: swift run TeaserHerdrTests
        language: system
        pass_filenames: false
        files: (\.swift$|^src/crates/teaser-core/|^src/runtime/herdr/src/api/schema|^src/runtime/herdr/docs/next/api/herdr-api\.schema\.json$|^Package\.(swift|resolved)$)
        stages: [pre-push]

      # Generate the thin App target, then let Xcode own bundling and signing.
      # The workspace shares the root SwiftPM lockfile through a symlink.
      - id: teaser-xcode-project
        name: XcodeGen project
        entry: xcodegen generate --no-env
        language: system
        pass_filenames: false
        files: &native-app-files '(^src/app/macos/Teaser(Launcher|PrivateAccessibility)?/|^project\.yml$|^Teaser\.xcworkspace/|^Package\.(swift|resolved)$|^\.pre-commit-config\.yaml$|^(LICENSE|NOTICE|TRADEMARKS\.md|THIRD_PARTY_NOTICES\.md)$)'

      - id: teaser-app-bundle
        name: Teaser.app builds
        entry: direnv exec . xcodebuild -workspace Teaser.xcworkspace -scheme Teaser -configuration Debug -destination platform=macOS -derivedDataPath target/xcode -clonedSourcePackagesDirPath .build -disableAutomaticPackageResolution -skipPackageUpdates build
        language: system
        pass_filenames: false
        files: *native-app-files
        stages: [pre-push]

      - id: teaser-app-signature
        name: Teaser.app signature
        entry: >-
          codesign --verify --deep --strict
          -R '=anchor apple generic and identifier "com.acture.teaser"'
          target/xcode/Build/Products/Debug/Teaser.app
        language: system
        pass_filenames: false
        files: *native-app-files
        stages: [pre-push]

      - id: teaser-app-resources
        name: Teaser.app resources (headless)
        entry: target/xcode/Build/Products/Debug/Teaser.app/Contents/MacOS/Teaser --check-bundle-resources
        language: system
        pass_filenames: false
        files: *native-app-files
        stages: [pre-push]

      - id: swift-test-bundle
        name: TeaserBundleTests
        entry: swift run TeaserBundleTests
        language: system
        pass_filenames: false
        files: (\.swift$|^project\.yml$|^Package\.(swift|resolved)$)
        stages: [pre-push]

      - id: fish-syntax
        name: fish -n
        entry: fish -n
        language: system
        files: \.fish$

      - id: fish-indent
        name: fish_indent --check
        entry: fish_indent --check
        language: system
        files: \.fish$
        # Preserve vendored upstream formatting; fish-syntax still checks it.
        exclude: ^src/runtime/herdr/vendor/
